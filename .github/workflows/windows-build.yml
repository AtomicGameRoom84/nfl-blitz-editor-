name: Windows build

# PyInstaller cannot cross-compile, so the Windows executable is built here on
# a hosted Windows runner. Download it from the run's Artifacts section, or
# from the Release when a tag is pushed.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executable
        run: python -m PyInstaller packaging/nfl_blitz_suite.spec --noconfirm

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # Generate the synthetic demo cartridge, then confirm the frozen build
          # starts and can load it. A build that cannot find its bundled game
          # definitions fails here rather than in a user's hands.
          python tools/make_demo_rom.py demo.z64
          $env:NFL_BLITZ_SUITE_SMOKE_ROM = "demo.z64"
          $proc = Start-Process -FilePath "dist\NFLBlitzModSuite.exe" `
            -ArgumentList "--self-test","demo.z64" -PassThru -Wait -NoNewWindow
          if ($proc.ExitCode -ne 0) {
            Write-Error "self-test exited with $($proc.ExitCode)"
            exit 1
          }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: NFLBlitzModSuite-windows
          path: dist/NFLBlitzModSuite.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NFLBlitzModSuite.exe
