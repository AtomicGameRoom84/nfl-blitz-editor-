[project]
name = "nfl-blitz-mod-suite"
version = "0.1.3"
description = "A ROM hacking and modding workbench for NFL Blitz on the Nintendo 64"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:core.*"]
